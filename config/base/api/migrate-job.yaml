# Schema migration + board registry sync. Runs to completion BEFORE the Deployment rolls out.
#
# After the migration it copies app/crawler/boards.json (baked into the image) into the
# departments/sources tables (`python -m app.crawl --sync-sources`: upsert, never deletes, safe to
# repeat). Without it /departments stays empty until someone runs the sync by hand. A bad
# boards.json fails this Job, so the Sync stops at wave 0 like a failed migration.
#
# Why a Sync hook (wave 0) and not PreSync: PreSync hooks run before every normal resource,
# including the Secret (overlays/api/secret.yaml), so on the very first sync the Job would start without
# DATABASE_URL and fail. As a Sync hook it is ordered by wave: Secret/ConfigMap (-1) ->
# this Job (0) -> Deployment and CronJob (1). Argo waits for the Job to finish before wave 1.
apiVersion: batch/v1
kind: Job
metadata:
  name: skku-notice-migrate
  labels:
    app.kubernetes.io/name: skku-notice-migrate
    app.kubernetes.io/part-of: skku-notice
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skku-notice-migrate
        app.kubernetes.io/part-of: skku-notice
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: tsungmn/skku-notice-api
          command:
            - sh
            - -c
            - python -m app.migrate && python -m app.crawl --sync-sources
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
